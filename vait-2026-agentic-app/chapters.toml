# Talk outline: chapters in order, each with sections in order.
# Each section is a folder with an agent.py exposing build_agent() (or ask() for raw model calls).
# compare_to = <path> picks the section the diff is shown against (default: the previous one).
# photo_prompts = [{ text, photo }] are scripted prompts that attach an image.
# hood = memory | system | streaming | loop | skills | team | structured | multimodal shows the Under the hood view.
# streaming = true makes the UI consume agent.stream_async() so text, thinking and tools appear live.
# slide = <file.md> shows a full-width slide instead of code and chat.
# A chapter with numbered = false has no numbers; nav = false keeps it out of the top bar.

[[chapter]]
title = "Intro"
numbered = false  # no chapter or section numbers
nav = false  # not in the top bar, which doubles as the agenda on these slides

